name: Build TapAttend NFC APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Verify APK Signature and Manifest
      run: |
        BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
        "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
        "$BUILD_TOOLS_DIR/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 15

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TapAttend-NFC-APK
        path: app/build/outputs/apk/debug/app-debug.apk
